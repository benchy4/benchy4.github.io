h1 { font-family:Georgia,"Times New Roman",serif; font-size:clamp(48px,6vw,82px); line-height:.88; letter-spacing:-.055em; margin:0; max-width:760px; font-weight:500; }

const data=JSON.parse(document.getElementById('foul-data').textContent);let season='All seasons',state='all',maxTime=90,selected={bucket:'0–15',margin:-3};const buckets=['76–90','61–75','46–60','31–45','16–30','0–15'],margins=Array.from({length:17},(_,i)=>i-8);
const pct=(v,d=0)=>v==null||Number.isNaN(v)?'—':(v*100).toFixed(d)+'%';const signed=(v,d=0)=>(v>0?'+':'')+v.toFixed(d);const label=m=>m===0?'Tied':m>0?'Up '+m:'Down '+Math.abs(m);const avg=(rows,key)=>{const a=rows.map(r=>r[key]).filter(v=>typeof v==='number');return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
function filtered(){return data.records.filter(r=>(season==='All seasons'||r.season===season)&&(state==='all'||r.defense_state===state)&&r.time_remaining<=maxTime)}
function render(){const rows=filtered(),sr=rows.filter(r=>r.time_bucket===selected.bucket&&r.defense_margin===selected.margin),fr=sr.filter(r=>r.nonshooting_foul_candidate),nr=sr.filter(r=>!r.nonshooting_foul_candidate);const band=['0–15','16–30'].includes(selected.bucket)?'0-30':['31–45','46–60'].includes(selected.bucket)?'31-60':'61-90';const policy=data.policy.find(p=>p.seconds_band===band&&p.defense_margin===selected.margin&&p.period_context==='fourth quarter');const supported=policy?.supported_for_guidance===true,guidance=selected.margin>=0?'Descriptive only':supported?policy.model_guidance:'No reliable model edge';const tr=rows.filter(r=>r.defense_margin<0),foulRate=rows.length?rows.filter(r=>r.nonshooting_foul_candidate).length/rows.length:0,supportedStates=data.policy.filter(p=>p.period_context==='fourth quarter'&&p.supported_for_guidance).length;
const heat=buckets.map(b=>`<div class="rowHead">${b}</div>`+margins.map(m=>{const rr=rows.filter(r=>r.time_bucket===b&&r.defense_margin===m),rate=rr.length?rr.filter(r=>r.nonshooting_foul_candidate).length/rr.length:null,alpha=rate==null?0:.12+rate*.88;return `<button class="heat ${selected.bucket===b&&selected.margin===m?'selected':''}" data-b="${b}" data-m="${m}" title="${label(m)}, ${b}s: ${rr.length} opportunities, ${pct(rate)} foul rate" style="background:${rate==null?'var(--empty)':`rgba(255,111,54,${alpha})`}"><span>${rr.length?pct(rate):'·'}</span><small>${rr.length||''}</small></button>`}).join('')).join('');
const bars=['0–15','16–30','31–45','46–60','61–75','76–90'].map(b=>{const rr=rows.filter(r=>r.time_bucket===b),rate=rr.length?rr.filter(r=>r.nonshooting_foul_candidate).length/rr.length:0;return `<div class="barRow"><span>${b}s</span><div><i style="width:${rate*100}%"></i></div><strong>${pct(rate,1)}</strong><small>n=${rr.length}</small></div>`}).join('');
document.getElementById('app').innerHTML=`<section class="hero"><div><p class="eyebrow">Late-game foul dashboard</p><h1>What teams did,<br><em>by clock and score.</em></h1><p class="intro">This is purely historical data. A lack of data in unique situations like fouling while leading means this page does not necessarily give great information about late game decisions.</p></div><div class="scoreboard"><div class="scoreTop"><span>SELECTED STATE</span><span>DEFENCE</span></div><div class="clock">:${selected.bucket.split('–')[1].padStart(2,'0')}</div><div class="margin ${selected.margin<0?'negative':selected.margin>0?'positive':''}">${label(selected.margin)}</div><div class="scoreFoot"><span>${selected.bucket} sec band</span><span>±8 scope</span></div></div></section>
<section class="controls"><label>Season<select id="season"><option>All seasons</option>${data.meta.seasons.map(s=>`<option ${s===season?'selected':''}>${s}</option>`).join('')}</select></label><div class="segmented">${['all','trailing','tied','leading'].map(s=>`<button class="filterBtn ${state===s?'active':''}" data-state="${s}">${s==='all'?'All states':s}</button>`).join('')}</div><label class="range">Window <strong>0–${maxTime}s</strong><input id="range" type="range" min="30" max="90" step="15" value="${maxTime}"></label><button class="export" id="export">Export view ↗</button></section><section class="scenarioGuide"><div><b>1 · Filter</b><span>Choose season, score state and time window.</span></div><div><b>2 · Select</b><span>Pick a cell in the decision map.</span></div><div><b>3 · Compare</b><span>Read sample size, foul rate and model support.</span></div></section>
<section class="metrics"><article><span>Opportunities shown</span><strong>${rows.length.toLocaleString()}</strong><small>possessions under current filters</small></article><article><span>Recorded foul rate</span><strong>${pct(foulRate,1)}</strong><small>non-shooting foul candidates</small></article><article><span>Trailing-team foul rate</span><strong>${pct(tr.length?tr.filter(r=>r.nonshooting_foul_candidate).length/tr.length:null,1)}</strong><small>${tr.length.toLocaleString()} trailing opportunities</small></article><article class="signal"><span>Model-supported states</span><strong>${supportedStates}</strong><small>fourth-quarter clock and margin cells</small></article></section>
<section class="workspace"><div class="panel matrixPanel"><div class="panelHead"><div><p class="kicker">Decision map</p><h2>When did teams foul?</h2></div><div class="legend"><span>Lower</span><i></i><span>Higher foul rate</span></div></div><p class="hint">Select a cell. Margin is from the defence’s perspective.</p><div class="matrixWrap"><div class="matrixGrid" style="grid-template-columns:72px repeat(17,minmax(34px,1fr))"><div class="corner">SECONDS</div>${margins.map(m=>`<div class="colHead">${m>0?'+'+m:m}</div>`).join('')}${heat}</div><div class="axis"><span>← Defence trailing</span><span>Tied</span><span>Defence leading →</span></div></div></div>
<aside class="decisionCard"><p class="kicker">Selected-state evidence</p><h2>${label(selected.margin)} · ${selected.bucket}s</h2><div class="badge ${supported?'supported':'caution'}">${guidance}</div><p class="decisionText">${sr.length?`${sr.length} comparable possessions are visible under the current filters. ${fr.length} contained a recorded non-shooting defensive foul candidate.`:'No possessions match this state under the current filters.'}</p><div class="compare"><div><span>Foul recorded</span><strong>${fr.length}</strong><small>Post-possession defence WP ${pct(avg(fr,'defense_wp_after_possession'),1)}</small></div><div><span>No foul recorded</span><strong>${nr.length}</strong><small>Post-possession defence WP ${pct(avg(nr,'defense_wp_after_possession'),1)}</small></div></div><dl><div><dt>Starting defence WP</dt><dd>${pct(avg(sr,'defense_wp_before'),1)}</dd></div><div><dt>Recorded foul share</dt><dd>${pct(sr.length?fr.length/sr.length:null,1)}</dd></div><div><dt>Modelled foul advantage</dt><dd>${policy?.estimated_foul_advantage==null?'—':signed(policy.estimated_foul_advantage*100,1)+' pp'}</dd></div><div><dt>Comparable-history support</dt><dd>${policy?.supported_for_estimation?'Adequate':'Limited'}</dd></div></dl><p class="note">A recorded foul is not necessarily intentional. The source lacks shot clock, bonus status and intended foul target.</p></aside></section>
<section class="lowerGrid"><div class="panel trend"><div class="panelHead"><div><p class="kicker">Clock pressure</p><h2>Foul rate by time remaining</h2></div></div><div class="bars">${bars}</div></div><div class="panel principles"><p class="kicker">How to read this</p><h2>Evidence before instinct</h2><ol><li><b>Start with state.</b><span>Clock and score margin define the decision—not the foul rate alone.</span></li><li><b>Check support.</b><span>Small or one-sided samples stay labelled limited.</span></li><li><b>Bring live context.</b><span>Shot clock, bonus and free-throw target are not in Hudl’s feed.</span></li></ol></div></section><section class="panel ftReboundInsight"><div><p class="kicker">Missed free throws</p><h2>Clutch FT OREB% is not meaningfully higher</h2><p>Clutch means the final 5:00 of the fourth quarter or overtime with the score within five points. Only missed free throws immediately followed by an identified rebound are included.</p></div><div class="ftRates"><div><span>Non-clutch</span><strong>${pct(data.meta.ft_oreb_comparison.non_clutch.rate,1)}</strong><small>${data.meta.ft_oreb_comparison.non_clutch.oreb} of ${data.meta.ft_oreb_comparison.non_clutch.opportunities.toLocaleString()}</small></div><div><span>Clutch</span><strong>${pct(data.meta.ft_oreb_comparison.clutch.rate,1)}</strong><small>${data.meta.ft_oreb_comparison.clutch.oreb} of ${data.meta.ft_oreb_comparison.clutch.opportunities}</small></div><p><b>${signed(data.meta.ft_oreb_comparison.difference*100,1)} percentage-point difference.</b> With only ${data.meta.ft_oreb_comparison.clutch.opportunities} clutch opportunities and p=${data.meta.ft_oreb_comparison.two_sided_p_value.toFixed(2)}, the data does not support increasing the expected FT OREB% in late-game foul decisions. Use the all-game ${pct(data.meta.ft_oreb_comparison.all.rate,1)} prior unless matchup information justifies an adjustment.</p></div></section><details class="panel method"><summary>Method and definitions</summary><p>The ±8 threshold is retained because it captures the practical one-to-three possession decision range without diluting it with states where intentional fouling is rarely rational. The model evidence is observational and not causal. “Foul recorded” means a non-shooting defensive foul candidate in the event feed; it does not prove coaching intent. Overtime possessions are included in observed tendencies, while the modelled policy shown in the selected-state card uses fourth-quarter estimates.</p></details><footer><span>WNBL Decision Lab</span><p>${data.meta.definition}. Observational evidence across seven seasons; not a causal coaching rule.</p><span>${data.meta.scope}</span></footer>`;
