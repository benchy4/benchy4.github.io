<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WNBL Box Score</title><style>
:root{--ink:#102624;--paper:#f3efe5;--card:#fffdf8;--line:#d8d3c7;--muted:#63716e;--orange:#f56b3b;--mint:#b9e8da;--soft:#e9e5dc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}a{color:inherit}.boxPage{max-width:1240px;margin:auto;padding:42px 4vw 82px}.backLink{display:inline-flex;align-items:center;gap:7px;margin-bottom:20px;color:#176b5d;font-size:12px;font-weight:850;text-decoration:none}.backLink:hover{text-decoration:underline}.scoreboard{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 14px 35px #1026240b}.gameHeader{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:20px 24px;border-bottom:1px solid var(--line)}.gameHeader small,.teamMeta,.tableNote,.source{color:var(--muted)}.gameHeader small{display:block;font-size:10px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.gameHeader h1{margin:4px 0 0;font:500 25px/1.1 Georgia,serif}.gameDetails{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px}.gameDetails span{padding:7px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:10px;font-weight:800}.scoreRows{padding:6px 24px}.scoreRow{display:grid;grid-template-columns:72px minmax(0,1fr) 78px;align-items:center;gap:14px;padding:17px 0}.scoreRow+.scoreRow{border-top:1px solid #e8e4da}.scoreTeam{display:flex;align-items:center;min-width:0;gap:16px}.scoreTeam img{width:54px;height:54px;object-fit:contain}.scoreTeam a{overflow:hidden;text-overflow:ellipsis;font-size:19px;font-weight:850;text-decoration:none;white-space:nowrap}.scoreTeam a:hover{text-decoration:underline}.scoreTeam small{display:block;margin-top:4px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.score{font:600 42px/1 Georgia,serif;text-align:right}.winner .score{color:#176b5d}.winner .scoreTeam a:after{content:' Winner';margin-left:8px;padding:3px 6px;border-radius:999px;background:var(--mint);font:800 9px Inter,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}.gameTabs{display:flex;gap:22px;padding:0 24px;border-top:1px solid var(--line);background:#faf8f2}.gameTabs a,.gameTabs span{display:block;padding:14px 0 12px;font-size:11px;font-weight:850;text-decoration:none}.gameTabs .active{border-bottom:3px solid var(--orange)}.teamSection{margin-top:34px}.teamHeading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px}.teamIdentity{display:flex;align-items:center;min-width:0;gap:12px}.teamIdentity img{width:42px;height:42px;object-fit:contain}.teamIdentity h2{margin:0;font:500 30px/1 Georgia,serif}.teamIdentity h2 a{text-decoration:none}.teamIdentity h2 a:hover{text-decoration:underline}.teamMeta{font-size:11px;font-weight:750;text-align:right}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}table{width:100%;border-collapse:collapse;font-size:12px}th{position:relative;background:#f8f6f0;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:10px;letter-spacing:.04em;text-transform:uppercase}td{padding:11px 10px;border-bottom:1px solid #e8e4da;white-space:nowrap;font-variant-numeric:tabular-nums}th,td{text-align:center}th:first-child,td:first-child{position:sticky;left:0;z-index:2;background:var(--card);box-shadow:1px 0 0 var(--line);text-align:left}th:first-child{z-index:4;background:#f8f6f0}.playerCell{min-width:190px}.playerCell a{font-weight:800;text-decoration-color:#8fa19d;text-underline-offset:3px}.jersey{display:inline-block;min-width:25px;margin-right:6px;color:var(--muted);font-size:10px}.shooting{font-weight:750}.pct{display:block;margin-top:2px;color:var(--muted);font-size:9px;font-weight:650}tr.total td{font-weight:900;background:#e2eee9;border-top:2px solid var(--ink);border-bottom:0}tr.total td:first-child{background:#e2eee9}.tableNote{margin:9px 2px 0;font-size:10px;line-height:1.5}.source{margin-top:34px;padding:15px 17px;border-radius:12px;background:#e6eee9;font-size:11px;line-height:1.55}.source a{font-weight:850}.lineupPilot{margin-top:44px;padding-top:28px;border-top:1px solid var(--line)}.lineupPilot>h2{margin:0;font:500 34px Georgia,serif}.lineupPilot>.tableNote{max-width:800px;margin:8px 0 20px}.lineupNames{min-width:460px;white-space:normal;line-height:1.5}.lineupNames a{font-weight:750;text-decoration-color:#8fa19d;text-underline-offset:3px}.validation{display:inline-flex;align-items:center;gap:7px;margin:0 0 15px;padding:7px 10px;border-radius:999px;background:var(--mint);font-size:10px;font-weight:850}.validation:before{content:'✓'}@media(max-width:700px){.boxPage{padding:24px 14px 60px}.gameHeader{display:block;padding:17px}.gameDetails{justify-content:flex-start;margin-top:12px}.scoreRows{padding:4px 16px}.scoreRow{grid-template-columns:48px minmax(0,1fr) 54px}.scoreTeam{gap:10px}.scoreTeam img{width:38px;height:38px}.scoreTeam a{font-size:15px}.score{font-size:32px}.teamIdentity h2{font-size:25px}.winner .scoreTeam a:after{display:none}.lineupNames{min-width:320px}}
</style></head><body><main class="boxPage" id="app"></main><script id="game-data" type="application/json">/*__GAME_DATA__*/</script><script>
const G=JSON.parse(document.getElementById('game-data').textContent),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),teamLabel=n=>n==='University of Canberra Capitals'?'UC Capitals':n==='Southside Melbourne Flyers'?'Southside Flyers':n,number=v=>Number(v||0),format=v=>number(v).toLocaleString(),pct=(m,a)=>a?`${(100*m/a).toFixed(1)}%`:'—',pair=(m,a)=>`${number(m)}-${number(a)}`;
document.title=teamLabel(G.team_2)+' at '+teamLabel(G.team_1)+' — Box Score';
const teamSlug=name=>G.team_slugs?.[name],playerSlug=name=>G.player_slugs?.[name],teamLink=name=>{const slug=teamSlug(name),label=esc(teamLabel(name));return slug?`<a href="team-${encodeURIComponent(slug)}.html">${label}</a>`:label},playerLink=name=>{const slug=playerSlug(name),label=esc(name);return slug?`<a href="player-${encodeURIComponent(slug)}.html">${label}</a>`:label};
const sumFields=['points','fg_made','fg_attempted','three_made','three_attempted','ft_made','ft_attempted','rebounds','offensive_rebounds','defensive_rebounds','assists','steals','turnovers','blocks','fouls'];
function totals(rows){const out={player:'Team total'};for(const key of sumFields)out[key]=rows.reduce((total,row)=>total+number(row[key]),0);return out}
const columns=[['player','Player'],['minutes','MIN'],['points','PTS'],['fg','FG'],['three','3PT'],['ft','FT'],['rebounds','REB'],['assists','AST'],['turnovers','TO'],['steals','STL'],['blocks','BLK'],['offensive_rebounds','OREB'],['defensive_rebounds','DREB'],['fouls','PF']];if(G.players.some(row=>row.plus_minus!=null))columns.push(['plus_minus','+/-']);
function cell(row,key,isTotal){if(key==='player')return `<td class="playerCell">${isTotal?(G.source_note?'Player totals':'Team total'):`<span class="jersey">${row.jersey_number?`#${esc(row.jersey_number)}`:''}</span>${playerLink(row.player)}`}</td>`;if(key==='plus_minus'&&isTotal)return '<td>—</td>';if(key==='fg')return `<td class="shooting">${pair(row.fg_made,row.fg_attempted)}<span class="pct">${pct(row.fg_made,row.fg_attempted)}</span></td>`;if(key==='three')return `<td class="shooting">${pair(row.three_made,row.three_attempted)}<span class="pct">${pct(row.three_made,row.three_attempted)}</span></td>`;if(key==='ft')return `<td class="shooting">${pair(row.ft_made,row.ft_attempted)}<span class="pct">${pct(row.ft_made,row.ft_attempted)}</span></td>`;const value=row[key];return `<td>${typeof value==='number'?format(value):esc(value||'—')}</td>`}
function boxTable(rows){const total=totals(rows),all=[...rows,total];return `<div class="tableWrap"><table><thead><tr>${columns.map(([key,label])=>`<th data-key="${key}">${label}</th>`).join('')}</tr></thead><tbody>${all.map((row,index)=>{const isTotal=index===all.length-1;return `<tr class="${isTotal?'total':''}">${columns.map(([key])=>cell(row,key,isTotal)).join('')}</tr>`}).join('')}</tbody></table></div><p class="tableNote">Shooting cells show made-attempted, with percentage underneath. Player order follows the collected box score.</p>`}
const away={name:G.team_2,logo:G.logo_2,score:number(G.score_2),location:'Away'},home={name:G.team_1,logo:G.logo_1,score:number(G.score_1),location:'Home'},teams=[away,home],winner=Math.max(away.score,home.score),gameTitle=`${teamLabel(away.name)} at ${teamLabel(home.name)}`;
function scoreRow(team){return `<div class="scoreRow ${team.score===winner&&away.score!==home.score?'winner':''}"><div class="scoreTeam"><img src="${esc(team.logo)}" alt="${esc(teamLabel(team.name))} logo"></div><div class="scoreTeam"><div><div>${teamLink(team.name)}</div><small>${team.location}</small></div></div><div class="score">${team.score}</div></div>`}
function teamAdvancedStats(team,rows){const opponent=teams.find(entry=>entry.name!==team.name),opponentRows=G.players.filter(player=>player.team===opponent.name),own=totals(rows),opp=totals(opponentRows),possessions=number(own.fg_attempted)+.44*number(own.ft_attempted)+number(own.turnovers),opponentPossessions=number(opp.fg_attempted)+.44*number(opp.ft_attempted)+number(opp.turnovers),offPpp=possessions?team.score/possessions:null,defPpp=opponentPossessions?opponent.score/opponentPossessions:null,efg=number(own.fg_attempted)?(number(own.fg_made)+.5*number(own.three_made))/number(own.fg_attempted):null,tovRate=possessions?number(own.turnovers)/possessions:null,orebDenominator=number(own.offensive_rebounds)+number(opp.defensive_rebounds),orebRate=orebDenominator?number(own.offensive_rebounds)/orebDenominator:null,freeThrowRate=number(own.fg_attempted)?number(own.ft_attempted)/number(own.fg_attempted):null,threeRate=number(own.fg_attempted)?number(own.three_attempted)/number(own.fg_attempted):null,kills=G.kills_by_team?.[team.name],metrics=[['POSS',possessions==null?'—':possessions.toFixed(1)],['PPP',offPpp==null?'—':offPpp.toFixed(2)],['Def PPP',defPpp==null?'—':defPpp.toFixed(2)],['Net PPP',offPpp==null||defPpp==null?'—':(offPpp-defPpp).toFixed(2)],['eFG%',efg==null?'—':(efg*100).toFixed(1)+'%'],['TOV%',tovRate==null?'—':(tovRate*100).toFixed(1)+'%'],['OREB%',orebRate==null?'—':(orebRate*100).toFixed(1)+'%'],['FTR',freeThrowRate==null?'—':(freeThrowRate*100).toFixed(1)+'%'],['3PR',threeRate==null?'—':(threeRate*100).toFixed(1)+'%']];if(kills!=null)metrics.push(['Kills',format(kills)]);return `<div class="tableWrap" style="margin-top:22px"><table data-tools-ready="1"><thead><tr>${metrics.map(([label])=>`<th>${label}</th>`).join('')}</tr></thead><tbody><tr>${metrics.map(([,value])=>`<td>${value}</td>`).join('')}</tr></tbody></table></div>`}
function teamSection(team){const rows=G.players.filter(player=>player.team===team.name);return `<section class="teamSection"><div class="teamHeading"><div class="teamIdentity"><img src="${esc(team.logo)}" alt=""><h2>${teamLink(team.name)}</h2></div><div class="teamMeta">${team.location} · ${team.score} points</div></div>${boxTable(rows)}${teamAdvancedStats(team,rows)}</section>`}
function rating(points,possessions){return possessions?(100*points/possessions).toFixed(1):'—'}
function lineupSection(){if(!G.lineups?.length)return '';const valid=G.lineup_validation?.player_plus_minus_reconciles&&G.lineup_validation?.lineup_plus_minus_reconciles;return `<section class="lineupPilot"><h2>Lineups</h2><p class="tableNote">Official five-player combinations from Hudl/InStat. Ratings are calculated per 100 listed possessions. Small samples can move sharply after one possession.</p>${valid?'<div class="validation">Player and lineup plus/minus reconcile to the final margin</div>':''}${teams.map(team=>{const rows=G.lineups.filter(row=>row.team===team.name).sort((a,b)=>{const seconds=value=>{const [m,s]=value.split(':').map(Number);return m*60+s};return seconds(b.minutes)-seconds(a.minutes)});return `<section class="teamSection"><div class="teamHeading"><div class="teamIdentity"><img src="${esc(team.logo)}" alt=""><h2>${teamLink(team.name)}</h2></div><div class="teamMeta">${rows.length} combinations</div></div><div class="tableWrap"><table><thead><tr><th>Five-player lineup</th><th>MIN</th><th>POSS</th><th>PTS</th><th>PTS allowed</th><th>ORtg</th><th>DRtg</th><th>Net</th><th>+/-</th></tr></thead><tbody>${rows.map(row=>{const allowed=number(row.points)-number(row.plus_minus),off=rating(number(row.points),number(row.possessions)),def=rating(allowed,number(row.possessions)),net=row.possessions?(Number(off)-Number(def)).toFixed(1):'—';return `<tr><td class="lineupNames">${row.players.map(playerLink).join(' · ')}</td><td>${esc(row.minutes)}</td><td>${format(row.possessions)}</td><td>${format(row.points)}</td><td>${format(allowed)}</td><td>${off}</td><td>${def}</td><td>${net}</td><td>${row.plus_minus>0?'+':''}${format(row.plus_minus)}</td></tr>`}).join('')}</tbody></table></div></section>`}).join('')}</section>`}
document.getElementById('app').innerHTML=`<a class="backLink" href="box-score-finder.html">← Box Score Finder</a><section class="scoreboard"><div class="gameHeader"><div><small>Final · WNBL</small><h1>${esc(gameTitle)}</h1></div><div class="gameDetails"><span>${esc(G.game_date)}</span><span>${esc(G.season)}</span><span>ID: ${esc(G.game_id)}</span></div></div><div class="scoreRows">${teams.map(scoreRow).join('')}</div><div class="gameTabs"><span class="active">Box score</span><a href="${esc(G.source_url)}/players" target="_blank" rel="noopener">InStat source ↗</a></div></section>${G.source_note?`<p class="source" role="note">${esc(G.source_note)}</p>`:''}${teams.map(teamSection).join('')}${lineupSection()}<div class="source">Box score calculated from the locally collected Hudl/InStat data. Box score: ${esc(G.box_score_status||'Unknown')} · Play-by-play: ${esc(G.pbp_status||'Unknown')} · Validation: ${esc(G.validation_status||'Unknown')}${G.lineup_source?` · Lineups: ${esc(G.lineup_source)}`:''}.</div>`;
</script></body></html>
