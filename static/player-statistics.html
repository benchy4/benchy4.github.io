<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player statistics — WNBL Data</title><style>
:root{--ink:#102624;--paper:#f3efe5;--card:#fffdf8;--line:#d8d3c7;--muted:#63716e;--orange:#f56b3b;--mint:#b9e8da}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}.hero{padding:58px 5vw 34px;background:var(--ink);color:white}.hero p{margin:0 0 12px;color:var(--mint);font-size:10px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.hero h1{margin:0;font:500 clamp(48px,7vw,84px)/.9 Georgia,serif;letter-spacing:-.05em}.hero span{display:block;max-width:780px;margin-top:20px;color:#b7c8c4;font-size:13px;line-height:1.55}.content{max-width:1500px;margin:auto;padding:30px 4vw 80px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}.controls label{display:grid;gap:5px;color:var(--muted);font-size:9px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.controls select,.controls input{min-width:170px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card)}.toggle{display:flex;padding:4px;background:#e6e0d5;border-radius:10px}.toggle button{border:0;background:transparent;padding:8px 12px;border-radius:7px;font-weight:800;cursor:pointer}.toggle button.active{background:var(--ink);color:white}.count{margin-left:auto;color:var(--muted);font-size:11px}.tableWrap{max-height:720px;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}table{width:100%;border-collapse:collapse;font-size:11px}th{position:sticky;top:0;z-index:3;padding:11px 9px;background:var(--card);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer}td{padding:9px;border-bottom:1px solid #ebe6dd;white-space:nowrap}th:first-child,td:first-child{position:sticky;left:0;background:var(--card);z-index:4}a{color:#176f5a;font-weight:800;text-underline-offset:3px}.num{font-variant-numeric:tabular-nums}@media(max-width:700px){.count{width:100%;margin:0}.controls label{flex:1}.controls select,.controls input{width:100%;min-width:0}}
</style></head><body><header class="hero"><p>League players</p><h1>Player statistics</h1><span>Filter player-seasons, compare traditional production with creation metrics, and open any player profile from the first column.</span></header><main class="content"><div class="controls"><label>Season<select id="season"></select></label><label>Team<select id="team"></select></label><label>Search<input id="search" type="search" placeholder="Player name"></label><div class="toggle"><button id="box" class="active">Box stats</button><button id="advanced">Advanced</button></div><span class="count" id="count"></span></div><div id="table"></div></main><script id="player-table-data" type="application/json">/*__PLAYER_TABLE_DATA__*/</script><script>
const D=JSON.parse(document.getElementById('player-table-data').textContent),$=id=>document.getElementById(id),fmt=(v,d=1)=>v==null?'—':Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}),pct=v=>v==null?'—':fmt(v*100,1)+'%',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let view='box',sortKey='points',sortDir=-1;
const boxCols=[['player_name','Player'],['season','Season'],['team','Team'],['games','GP'],['minutes_per_game','MIN'],['points_per_game','PTS'],['fg_percentage','FG%'],['two_percentage','2P%'],['three_percentage','3P%'],['ft_percentage','FT%'],['rebounds_per_game','REB'],['assists_per_game','AST'],['steals_per_game','STL'],['turnovers_per_game','TO'],['blocks_per_game','BLK'],['fouls_per_game','PF']],advancedCols=[['player_name','Player'],['season','Season'],['team','Team'],['points_per_40','PTS / 40'],['assists_per_40','AST / 40'],['turnovers_per_40','TO / 40'],['offensive_rebounds_per_40','OREB / 40'],['steals_per_40','STL / 40'],['blocks_per_40','BLK / 40'],['total_points_created','Total points created'],['creation_dependency_share','Creation dependency'],['points_created','Assist points created'],['scorer_partners','Scorer partners'],['creation_play_type_entropy','Creation diversity'],['top_partner_share','Top partner share'],['assisted_make_share','Assisted make share'],['clutch_points','Clutch PTS'],['clutch_fg_percentage','Clutch FG%']];
advancedCols.splice(3,0,['offensive_win_shares','OWS'],['defensive_win_shares','DWS'],['win_shares','WS'],['win_shares_per_40','WS/40'],['team_win_share','Team WS%'],['adjusted_win_shares','Adj WS'],['adjusted_win_shares_per_40','Adj WS/40']);
const rows=D.players.map(r=>{const g=r.games||1,fga=r.fg_attempted||0,tpa=r.three_attempted||0;return {...r,minutes_per_game:(r.minutes_seconds||0)/g/60,points_per_game:(r.points||0)/g,rebounds_per_game:(r.rebounds||0)/g,assists_per_game:(r.assists||0)/g,steals_per_game:(r.steals||0)/g,turnovers_per_game:(r.turnovers||0)/g,blocks_per_game:(r.blocks||0)/g,fouls_per_game:(r.fouls||0)/g,fg_percentage:fga?r.fg_made/fga:null,two_percentage:fga-tpa?(r.fg_made-r.three_made)/(fga-tpa):null,three_percentage:tpa?r.three_made/tpa:null,ft_percentage:r.ft_attempted?r.ft_made/r.ft_attempted:null}});
boxCols.push(['plus_minus_per_game','+/-']);advancedCols.push(['plus_minus','+/- total']);rows.forEach(r=>r.plus_minus_per_game=(r.plus_minus||0)/(r.games||1));
advancedCols.push(['on_plus_minus_per_40','On +/- / 40'],['off_plus_minus_per_40','Off +/- / 40'],['on_off_plus_minus_per_40','On/off / 40'],['plus_minus','+/-']);
season.innerHTML='<option value="">All seasons</option>'+D.seasons.map(x=>`<option>${x}</option>`).join('');team.innerHTML='<option value="">All teams</option>'+D.teams.map(x=>`<option>${esc(x)}</option>`).join('');
function display(k,v,r){if(k==='player_name')return `<a href="player-${D.slugs[v]}.html">${esc(v)}</a>`;if(k.endsWith('_percentage')||k.endsWith('_share')||k==='creation_dependency_share')return pct(v);if(typeof v==='number')return fmt(v,k.includes('plus_minus_per_40')||k.startsWith('on_off_ci_')||['offensive_win_shares','defensive_win_shares','win_shares','win_shares_per_40','adjusted_win_shares','adjusted_win_shares_per_40'].includes(k)?2:['games','total_points_created','points_created','scorer_partners','clutch_points'].includes(k)?0:1);return esc(v)}
function render(){const cols=view==='box'?boxCols:advancedCols,q=search.value.trim().toLowerCase(),filtered=rows.filter(r=>(!season.value||r.season===season.value)&&(!team.value||r.team===team.value)&&(!q||r.player_name.toLowerCase().includes(q))).sort((a,b)=>{const x=a[sortKey],y=b[sortKey];return (typeof x==='number'&&typeof y==='number'?x-y:String(x??'').localeCompare(String(y??'')))*sortDir});count.textContent=filtered.length+' player-seasons';table.innerHTML=`<div class="tableWrap"><table><thead><tr>${cols.map(c=>`<th data-k="${c[0]}">${c[1]}</th>`).join('')}</tr></thead><tbody>${filtered.map(r=>`<tr>${cols.map(c=>`<td class="${typeof r[c[0]]==='number'?'num':''}">${display(c[0],r[c[0]],r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;table.querySelectorAll('th').forEach(th=>th.onclick=()=>{sortDir=sortKey===th.dataset.k?-sortDir:-1;sortKey=th.dataset.k;render()})}
[season,team,search].forEach(x=>x.oninput=render);box.onclick=()=>{view='box';box.classList.add('active');advanced.classList.remove('active');render()};advanced.onclick=()=>{view='advanced';advanced.classList.add('active');box.classList.remove('active');render()};render();
</script></body></html>
