function value(r,k){let v=r[k];if(k==='two_made')v=(r.fg_made||0)-(r.three_made||0);if(k==='two_attempted')v=(r.fg_attempted||0)-(r.three_attempted||0);if(k==='fg_percentage')v=r.fg_attempted?r.fg_made/r.fg_attempted:null;if(k==='effective_fg_percentage')v=r.fg_attempted?((r.fg_made||0)+.5*(r.three_made||0))/r.fg_attempted:null;if(k==='two_percentage'){const a=(r.fg_attempted||0)-(r.three_attempted||0);v=a?((r.fg_made||0)-(r.three_made||0))/a:null}if(k==='three_percentage')v=r.three_attempted?r.three_made/r.three_attempted:null;if(k==='ft_percentage')v=r.ft_attempted?r.ft_made/r.ft_attempted:null;if(basis==='game'&&countKeys.has(k))v=(v||0)/(r.games||1);if(k==='minutes_seconds')v=basis==='game'?(v||0)/(r.games||1)/60:(v||0)/60;return v}function display(k,v,r){if(k==='player_name'&&ALL.player_slugs[v])return `<a href="player-${ALL.player_slugs[v]}.html"><strong>${esc(v)}</strong> ↗</a>`;if(k==='opponent')return esc(teamLabel(v));if(k==='date'&&r.game_id)return `<a href="box-score-${r.game_id}.html"><strong>${esc(v)}</strong> ↗</a>`;if(k.endsWith('_percentage')||k.endsWith('_rate')||k.endsWith('_share')||k==='network_density'||k==='oreb_extension_rate')return pct(v);if(k.includes('plus_minus_per_40')||k.startsWith('on_off_ci_'))return fmt(v,2);if(['ppp','defensive_ppp','net_ppp','extension_points_per_possession','points_per_fga','creation_play_type_entropy','points_saved_per_100','stabilized_points_saved_per_100'].includes(k))return fmt(v,3);if(typeof v==='number')return fmt(v,basis==='game'||['average_margin','possessions_per_game','points_per_40','assists_per_40','turnovers_per_40','offensive_rebounds_per_40','steals_per_40','blocks_per_40','on_minutes','off_minutes'].includes(k)?1:0);return esc(v)}const lowerBetter=new Set(["losses","points_allowed","turnovers","fouls","defensive_ppp","turnover_rate","points_per_opportunity","defended_fg_percentage","shooting_foul_rate"]);const rowId=r=>r._rank_id||(r.season||'')+'|'+(r.player_id||r.player_name||'');function rankBadge(rank,total){const t=total>1?(rank-1)/(total-1):0,h=Math.round(145-140*t);return "<sup class=\"rankBadge\" style=\"--rank-h:"+h+"\" title=\"Rank "+rank+" of "+total+"\">"+rank+"</sup>"}function ranksFor(rows,cols,useIds=false,groupBySeason=false){const out=new Map;for(const[k]of cols){const groups=groupBySeason?[...rows.reduce((m,r)=>{const g=r.season||'';if(!m.has(g))m.set(g,[]);m.get(g).push(r);return m},new Map).values()]:[rows];for(const group of groups){const valid=group.map((r,i)=>({r,i,v:value(r,k)})).filter(x=>typeof x.v==="number").sort((a,b)=>(lowerBetter.has(k)?1:-1)*(a.v-b.v)),total=valid.length;let prior,rank=0;valid.forEach((x,i)=>{if(x.v!==prior)rank=i+1;prior=x.v;out.set((useIds?rowId(x.r):x.i)+"|"+k,[rank,total])})}}return out}function table(rows,cols,ranks,useIds=false){return `<div class="tableWrap"><table><thead><tr>${cols.map(c=>`<th data-key="${c[0]}">${c[1]}</th>`).join('')}</tr></thead><tbody>${rows.map((r,rowIndex)=>`<tr>${cols.map(c=>{const v=value(r,c[0]),key=(useIds?rowId(r):rowIndex)+"|"+c[0];return `<td class="${typeof v==='number'?'num':''}">${display(c[0],v,r)}${rankMode&&ranks?.has(key)?rankBadge(...ranks.get(key)):""}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}function drawTable(root,rows,cols,rankRows=rows,useIds=false,groupBySeason=false){const paint=()=>{root.innerHTML=table(rows,cols,ranksFor(rankRows,cols,useIds,groupBySeason),useIds);root.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.key,dir=th.dataset.dir==='asc'?-1:1;th.dataset.dir=dir===1?'asc':'desc';rows.sort((a,b)=>{const av=value(a,k),bv=value(b,k);return (typeof av==='number'&&typeof bv==='number'?av-bv:String(av).localeCompare(String(bv)))*dir});paint()})};paint()}
const baseTeamDisplay=display;display=function(k,v,r){if(['offensive_win_shares','defensive_win_shares','win_shares','win_shares_per_40','adjusted_win_shares','adjusted_win_shares_per_40'].includes(k))return fmt(v,2);return baseTeamDisplay(k,v,r)};
