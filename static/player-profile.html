document.getElementById('app').innerHTML=`<section class="hero"><div class="heroText"><div class="eyebrow">${P.team} · Player profile</div><h1>${esc(P.name)}</h1><div class="bio"><div><span>Number</span><strong>#${P.number}</strong></div><div><span>Position</span><strong>${P.position||'—'}</strong></div><div><span>Height</span><strong>${P.height}</strong></div><div><span>Date of birth</span><strong>${P.dob}</strong></div></div></div><div class="photo"><img src="${P.photo}" alt="${esc(P.name)} official WNBL portrait"></div></section><main class="content"><section class="stats"><div class="stat"><span>Games</span><strong>${P.career.games}</strong></div><div class="stat"><span>Minutes per game</span><strong>${fmt(per(P.career.minutes_seconds,P.career.games)/60)}</strong></div><div class="stat"><span>Points per game</span><strong>${fmt(per(P.career.points,P.career.games))}</strong></div><div class="stat"><span>3-point percentage</span><strong>${pct(P.career.three_attempted?P.career.three_made/P.career.three_attempted:null)}</strong></div><div class="stat"><span>Rebounds per game</span><strong>${fmt(per(P.career.rebounds,P.career.games))}</strong></div><div class="stat"><span>Assists per game</span><strong>${fmt(per(P.career.assists,P.career.games))}</strong></div><div class="stat"><span>Steals per game</span><strong>${fmt(per(P.career.steals,P.career.games))}</strong></div><div class="stat"><span>Free throw percentage</span><strong>${pct(P.career.ft_attempted?P.career.ft_made/P.career.ft_attempted:null)}</strong></div><div class="stat"><span>Blocks per game</span><strong>${fmt(per(P.career.blocks,P.career.games))}</strong></div><div class="stat"><span>Turnovers per game</span><strong>${fmt(per(P.career.turnovers,P.career.games))}</strong></div><div class="stat"><span>Personal fouls per game</span><strong>${fmt(per(P.career.fouls,P.career.games))}</strong></div></section><section class="insightGrid"><article class="insightCard"><h3>Player percentile profile</h3><p>Select g production by recorded shot family.</p></div><div class="controls"><select id="shotSeason"><option value="">All seasons</option>${[...new Set(P.shot_type.map(x=>x.season))].map(s=>`<option>${s}</option>`).join('')}</select></div></div><div id="shotTable"></div></section><section class="section"><div class="sectionHead"><div><h2>Career game log</h2><p>One recorded player-game per row.</p></div><div class="controls"><select id="logSeason"><option value="">All seasons</option>${[...new Set(P.game_log.map(x=>x.season))].map(s=>`<option>${s}</option>`).join('')}</select></div></div><div id="gameTable"></div></section><div class="source"><strong>Data provenance:</strong> number, height, date of birth, position and portrait come from <a href="${P.source}" target="_blank" rel="noopener">WNBL’s official player profile ↗</a>. Every statistic and game-log row comes from the locally collected Hudl/InStat dataset—not WNBL’s statistics. Play-type, shot-type and defensive results are coded from individual events, so their attempt totals may differ from official box-score totals.</div></main>`;
