<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WNBL Box Score Finder</title><style>
:root{--ink:#102624;--paper:#f3efe5;--card:#fffdf8;--line:#d8d3c7;--muted:#63716e;--mint:#b9e8da}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}a{color:inherit}.top{height:62px;padding:0 4vw;display:flex;align-items:center;border-bottom:1px solid var(--line)}.top a{text-decoration:none;font-size:12px;font-weight:800}.hero{padding:74px 4vw 54px;background:var(--ink);color:#fff}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:850;color:var(--mint)}h1{font:500 clamp(58px,8vw,112px)/.86 Georgia,serif;letter-spacing:-.06em;margin:14px 0 22px}.hero p{color:#afc2bd;max-width:720px;line-height:1.6}.content{max-width:1500px;margin:auto;padding:34px 4vw 80px}.filters{display:grid;grid-template-columns:minmax(260px,1fr) 180px 180px;gap:10px;margin-bottom:18px}.filters input,.filters select{padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--card);font:inherit}.count{font-size:12px;color:var(--muted);margin:10px 0}.tableWrap{overflow:auto;max-height:720px;border:1px solid var(--line);border-radius:14px;background:var(--card)}table{width:100%;border-collapse:collapse;font-size:12px}th{position:sticky;top:0;background:var(--card);text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}td{padding:10px;border-bottom:1px solid #e8e4da;white-space:nowrap}th:first-child,td:first-child{position:sticky;left:0;background:var(--card);z-index:2;box-shadow:1px 0 0 var(--line)}th:first-child{z-index:4}td.num{text-align:right}.open{color:#176f5a;font-weight:850}@media(max-width:720px){.filters{grid-template-columns:1fr}}
</style></head><body><header class="top"><a href="analysis-hub.html">← Analysis Hub</a></header><section class="hero"><div class="eyebrow">Every collected game</div><h1>Box Score Finder.</h1><p>Search by team, date, season or game ID, then open the complete player box score.</p></section><main class="content"><div class="filters"><input id="search" type="search" placeholder="Search teams, date or game ID…"><select id="season"><option value="">All seasons</option></select><select id="team"><option value="">All teams</option></select></div><div class="count" id="count"></div><div id="table"></div></main><script id="finder-data" type="application/json">/*__FINDER_DATA__*/</script><script>
const D=JSON.parse(document.getElementById('finder-data').textContent),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),teamLabel=n=>n==='University of Canberra Capitals'?'UC Capitals':n==='Southside Melbourne Flyers'?'Southside Flyers':n;let sortKey='game_date',sortDir=-1;const teams=[...new Set(D.games.flatMap(g=>[g.team_1,g.team_2]))].sort();season.innerHTML='<option value="">All seasons</option>'+D.seasons.map(s=>`<option>${s}</option>`).join('');team.innerHTML='<option value="">All teams</option>'+teams.map(t=>`<option value="${esc(t)}">${esc(teamLabel(t))}</option>`).join('');function render(){const q=search.value.trim().toLowerCase(),s=season.value,t=team.value,rows=D.games.filter(g=>(!s||g.season===s)&&(!t||g.team_1===t||g.team_2===t)&&(!q||[g.game_id,g.game_date,g.team_1,g.team_2,teamLabel(g.team_1),teamLabel(g.team_2),g.season].join(' ').toLowerCase().includes(q))).sort((a,b)=>String(a[sortKey]).localeCompare(String(b[sortKey]))*sortDir);count.textContent=`${rows.length} game${rows.length===1?'':'s'}`;table.innerHTML=`<div class="tableWrap"><table><thead><tr>${[['game_date','Date'],['season','Season'],['team_2','Away'],['team_1','Home'],['score','Score'],['game_id','Game ID'],['open','Box score']].map(c=>`<th data-key="${c[0]}">${c[1]}</th>`).join('')}</tr></thead><tbody>${rows.map(g=>`<tr><td>${g.game_date}</td><td>${g.season}</td><td>${esc(teamLabel(g.team_2))}</td><td>${esc(teamLabel(g.team_1))}</td><td class="num">${g.score_2}–${g.score_1}</td><td>${g.game_id}</td><td><a class="open" href="box-score-${g.game_id}.html">Open ↗</a></td></tr>`).join('')}</tbody></table></div>`;table.querySelectorAll('th[data-key]').forEach(th=>th.onclick=()=>{sortDir=sortKey===th.dataset.key?-sortDir:1;sortKey=th.dataset.key;render()})}const requestedSeason=new URLSearchParams(location.search).get('season');if(D.seasons.includes(requestedSeason))season.value=requestedSeason;search.oninput=render;season.onchange=render;team.onchange=render;render();
</script></body></html>
