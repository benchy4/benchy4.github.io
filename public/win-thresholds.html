<section class="page" id="chemistry"><p class="eyebrow">Creation networks</p><h1>Assist connections by volume and lift</h1><p class="lede">Each arrow runs from passer to scorer. Thicker arrows show more assisted makes; separate curved arrows show two-way connections.</p><div class="toolbar"><label>Season<select id="netSeason"></select></label><label>Team<select id="netTeam"></select></label><label>View<select id="netMode"><option value="volume">Assist volume</option><option value="chemistry">Chemistry lift</option></select></label></div><div class="networkLayout"><div class="network" id="network"></div><aside class="networkNote" id="networkNote"></aside></div><div class="legend"><span><i class="dot" style="background:var(--orange)"></i>primary creator</span><span><i class="dot" style="background:var(--blue)"></i>two-way hub</span><span><i class="dot" style="background:var(--lime)"></i>finishing target</span><span>Arrow colour = passer role</span><span>Width = directional assists</span></div><div class="explain"><h2>How lift is calculated</h2><p>The expected connection count is calculated from the creator’s assist share and the scorer’s assisted-make share inside the same team-season. Lift above 1.0 means the pairing occurred more often than that independence baseline predicts. Excess makes shows the count above expectation. Lift measures connection frequency, not causal impact on efficiency.</p></div><div id="chemTable"></div></section>






<section class="page" id="thresholds"><p class="eyebrow">Game-level winning indicators</p><h1>Win Thresholds</h1><p class="lede">Thresholds showing what percentage of games were won when a team had more or less than the specified stat. This has some unreliability and limited application due to the evolving statistical averages of the league.</p><div class="toolbar"><label>Explore statistic<select id="thresholdMetric">${[...new Map(D.thresholdResults.map(r=>[r.metric,r.metric_label])).entries()].map(([k,v])=>`<option value="${k}">${shortStatLabel(v)}</option>`).join('')}</select></label></div><div class="grid2"><div class="panel"><h2>Win probability by threshold</h2><div id="thresholdChart"></div></div><div class="panel" id="thresholdNarrative"></div></div><div class="panel"><p class="eyebrow">Win Thresholds</p><h2>Single-stat thresholds</h2>${table('selectedThresholdTable',D.selectedThresholds.map(r=>({...r,rule_label:shortStatLabel(r.metric_label)+' '+directionText(r.direction)+' '+thresholdDisplay(r.metric,r.threshold)})),[['rule_label','Rule'],['model_win_probability','Seven-season model',pct],['validation_win_rate','Rolling actual win rate',pct],['validation_n','Rolling team-games',v=>fmt(v,0)],['rolling_folds','Seasons tested',v=>fmt(v,0)]])}</div><div class="panel" style="margin-top:20px"><p class="eyebrow">Two-condition rules</p><h2>Combined thresholds</h2><p>These pairs are descriptive checks across the rolling evaluation seasons. Related shooting measures can describe the same underlying performance, so use the simpler single-stat rule where possible.</p>${table('thresholdComboTable',D.thresholdCombinations,[["label_1","Condition one",shortStatLabel],['direction_1','Direction',v=>v==='at_least'?'At least':'At most'],['threshold_1','Threshold'],["label_2","Condition two",shortStatLabel],['direction_2','Direction',v=>v==='at_least'?'At least':'At most'],['threshold_2','Threshold'],['validation_n','Rolling team-games',v=>fmt(v,0)],['validation_win_rate','Rolli
