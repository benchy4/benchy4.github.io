<section class="page" id="thresholds"><p class="eyebrow">Game-level winning indicators</p><h1>Win Thresholds</h1><p class="lede">Each season from 2021–22 onward was predicted only from seasons that came before it. These rolling tests show whether each statistical relationship repeated over time. After that check, all all available seasons were used to estimate the final win probabilities.</p><div class="toolbar"><label>Explore statistic<select id="thresholdMetric">${[...new Map(D.thresholdResults.map(r=>[r.metric,r.metric_label])).entries()].map(([k,v])=>`<option value="${k}">${shortStatLabel(v)}</option>`).join('')}</select></label></div><div class="grid2"><div class="panel"><h2>Win probability by threshold</h2><div id="thresholdChart"></div></div><div class="panel" id="thresholdNarrative"></div></div><div class="panel"><p class="eyebrow">Win Thresholds</p><h2>Single-stat thresholds</h2>${table('selectedThresholdTable',D.selectedThresholds.map(r=>({...r,rule_label:shortStatLabel(r.metric_label)+' '+directionText(r.direction)+' '+thresholdDisplay(r.metric,r.threshold)})),[['rule_label','Rule'],['model_win_probability','All-season model',pct],['validation_win_rate','Rolling actual win rate',pct],['validation_n','Rolling team-games',v=>fmt(v,0)],['rolling_folds','Seasons tested',v=>fmt(v,0)]])}</div><div class="panel" style="margin-top:20px"><p class="eyebrow">Two-condition rules</p><h2>Combined thresholds</h2><p>These pairs are descriptive checks across the rolling evaluation seasons. Related shooting measures can describe the same underlying performance, so use the simpler single-stat rule where possible.</p>${table('thresholdComboTable',D.thresholdCombinations,[["label_1","Condition one",shortStatLabel],['direction_1','Direction',v=>v==='at_least'?'At least':'At most'],['threshold_1','Threshold'],["label_2","Condition two",shortStatLabel],['direction_2','Direction',v=>v==='at_least'?'At least':'At most'],['threshold_2','Threshold'],['validation_n','Rolling team-games',v=>fmt(v,0)],['validation_win_rate','Rolling win rate',pct]])}</div><div class="explain"><h2>How the reference point is selected</h2><p>The model fits a smooth relationship between each statistic and winning, then tests it one season at a time using only earlier seasons. A reference point must reach 70% in both the rolling model and the final all-season model, produce at least a 65% actual rolling win rate, stay within eight percentage points of that observed result, and include at least 40 team-games across three test seasons. Games, rather than individual team rows, are resampled when uncertainty is calculated so the two opponents are kept together.</p></div></section>
